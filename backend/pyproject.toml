[project]
name = "zahlmeister-backend"
version = "0.19.0"
description = "Zahlmeister API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "cryptography>=45,<46",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501", "UP035"]
