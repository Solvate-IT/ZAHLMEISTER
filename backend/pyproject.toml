[project]
name = "zahlmeister-backend"
version = "0.19.0"
description = "Zahlmeister API"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20,<2",
  "argon2-cffi>=25.1,<26",
  "asyncpg>=0.31,<1",
  "fastapi>=0.141.1,<1",
  "cryptography>=50.0.1,<51",
  "httpx>=0.28.1,<1",
  "openpyxl>=3.1.5,<4",
  "phonenumbers>=9.0.40,<10",
  "pypdf>=6.19,<7",
  "python-multipart>=0.0.32,<1",
  "reportlab>=5.0.1,<6",
  "pydantic-settings>=2.15,<3",
  "sqlalchemy[asyncio]>=2.0.54,<3",
  "uvicorn[standard]>=0.53,<1",
]

[project.optional-dependencies]
dev = [
  # starlette.testclient runs on httpx2 and deprecates the httpx fallback;
  # the app itself keeps using httpx.
  "httpx2>=2.13,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501", "UP035"]
