# Alembic CLI configuration for developers creating revisions, e.g. inside the
# backend container:  alembic revision --autogenerate -m "describe the change"
# Deployments never use this file: python -m app.db.bootstrap configures Alembic
# in code and applies migrations together with the schema drift check.
[alembic]
script_location = %(here)s/app/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
