name: Generate Python constraints

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/generate-python-constraints.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build known-good backend test image
        run: docker build --target test -f docker/backend.Dockerfile -t zahlmeister-constraints-source .

      - name: Generate pinned constraints
        run: |
          set -euo pipefail
          docker run --rm zahlmeister-constraints-source python -m pip freeze \
            | grep -vE '^zahlmeister-backend([[:space:]@=]|$)' \
            | LC_ALL=C sort > backend/constraints.txt
          test -s backend/constraints.txt
          grep -q '^fastapi==' backend/constraints.txt
          grep -q '^sqlalchemy==' backend/constraints.txt
          grep -q '^pytest==' backend/constraints.txt
          grep -q '^ruff==' backend/constraints.txt

      - name: Require constraints in backend Docker builds
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docker/backend.Dockerfile')
          text = path.read_text()
          old = 'COPY backend/pyproject.toml ./\nCOPY backend/app ./app\nRUN pip install --no-cache-dir --prefix=/home/app/.local .\n\nFROM base AS test\nRUN pip install --no-cache-dir --prefix=/home/app/.local ".[dev]"\n'
          new = 'COPY backend/pyproject.toml backend/constraints.txt ./\nCOPY backend/app ./app\nRUN pip install --no-cache-dir --constraint constraints.txt --prefix=/home/app/.local .\n\nFROM base AS test\nRUN pip install --no-cache-dir --constraint constraints.txt --prefix=/home/app/.local ".[dev]"\n'
          if text.count(old) != 1:
              raise SystemExit('Expected backend dependency installation block exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify constrained backend build and tests
        run: |
          set -euo pipefail
          docker build --no-cache --target test -f docker/backend.Dockerfile -t zahlmeister-constrained-test .
          docker run --rm -e ENVIRONMENT=test -e READINESS_REQUIRE_WORKER=false zahlmeister-constrained-test sh -c 'python -m pip check && ruff check app tests && pytest -q'

      - name: Commit tested constraints
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/constraints.txt docker/backend.Dockerfile
          git rm .github/workflows/generate-python-constraints.yml
          git commit -m "Pin Python build dependencies"
          git push origin HEAD:development
