name: Run billing cleanup

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/run-billing-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply existing payment-first cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/billing-cleanup.yml').read_text().splitlines()
          marker = '      - name: Apply payment-first billing cleanup'
          try:
              start = source.index(marker)
          except ValueError as exc:
              raise SystemExit('Billing cleanup step not found') from exc
          run_index = next(
              index for index in range(start + 1, len(source))
              if source[index] == '        run: |'
          )
          end = next(
              (
                  index for index in range(run_index + 1, len(source))
                  if source[index].startswith('      - name: ')
              ),
              len(source),
          )
          body = []
          for line in source[run_index + 1:end]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  raise SystemExit(f'Unexpected indentation in billing cleanup: {line!r}')
          script = Path('/tmp/apply-billing-cleanup.sh')
          script.write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/apply-billing-cleanup.sh

      - name: Align billing tests with payment-first v2
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_mollie_billing.py')
          text = path.read_text()
          text = text.replace(
              'from datetime import UTC, date, datetime, timedelta\n',
              'from datetime import UTC, datetime, timedelta\n',
              1,
          )
          text = text.replace('    _add_year,\n', '', 1)
          stale_test = '''\n\ndef test_annual_renewal_handles_leap_day() -> None:\n    assert _add_year(date(2028, 2, 29)) == date(2029, 2, 28)\n'''
          if stale_test not in text:
              raise SystemExit('Stale annual renewal test not found')
          text = text.replace(stale_test, '\n', 1)
          for stale_state in (
              '        "subscription_id": "sub_old",\n',
              '        "subscription_status": "canceled",\n',
          ):
              if stale_state not in text:
                  raise SystemExit(f'Stale subscription test state not found: {stale_state.strip()}')
              text = text.replace(stale_state, '', 1)
          path.write_text(text)
          PY

      - name: Verify no stale billing paths remain
        run: |
          set -euo pipefail
          ! grep -RniE 'legacy|pre-v2|_create_due_renewal|_apply_invoice_entitlement|_retry_local_invoice|_create_remote_invoice|_cancel_renewal_invoices|_invoice_create_retry_allowed|_add_year|subscription_id|subscription_status' backend/app/services/mollie_billing*.py backend/tests/test_mollie*.py
          ! grep -Rni '_core._mollie_row =' backend

      - name: Run full backend quality suite
        run: |
          docker build --target test -f docker/backend.Dockerfile -t zahlmeister-billing-cleanup-test .
          docker run --rm -e ENVIRONMENT=test -e READINESS_REQUIRE_WORKER=false zahlmeister-billing-cleanup-test sh -c 'ruff check app tests && pytest -q'

      - name: Commit tested cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u backend
          git rm .github/workflows/billing-cleanup.yml .github/workflows/run-billing-cleanup.yml
          git commit -m "Remove legacy Mollie billing paths"
          git push origin HEAD:development
