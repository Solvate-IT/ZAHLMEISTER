name: Zahlmeister Development Quality

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zahlmeister-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Ruff and backend tests
        working-directory: backend
        run: |
          ruff check app tests
          python -m pytest -q

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend tests, typecheck and export build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run check

  operations:
    name: Docker and configuration quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare CI environment selector
        shell: bash
        run: |
          printf 'ENVIRONMENT=development\n' > docker/.env
          chmod 600 docker/.env

      - name: Validate environment, Compose and shell scripts
        shell: bash
        run: |
          set -euo pipefail
          source docker/scripts/env.sh
          check_env_parity
          bash -n docker/manage.sh docker/predeploy.sh docker/scripts/*.sh mobile/tool/bootstrap_mobile.sh
          docker compose "${COMPOSE_ENV_ARGS[@]}" -f docker/compose.yml config -q
          docker compose --env-file docker/.env.production -f docker/compose.prod.yml config -q
