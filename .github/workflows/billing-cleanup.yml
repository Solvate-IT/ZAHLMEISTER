name: Billing cleanup

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/billing-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply payment-first billing cleanup
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from textwrap import dedent

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"Expected one {label}, found {count}")
              return result

          def remove_function(text: str, name: str) -> str:
              return replace_once(
                  text,
                  rf"^(?:async )?def {re.escape(name)}\(.*?(?=^(?:async )?def |\Z)",
                  "",
                  f"function {name}",
              )

          core_path = Path("backend/app/services/mollie_billing_core.py")
          core = core_path.read_text()
          core = core.replace(
              "from datetime import UTC, date, datetime, timedelta",
              "from datetime import UTC, datetime, timedelta",
          )

          new_row = dedent('''
          async def _mollie_row(
              session: AsyncSession,
              organization_id: UUID,
              *,
              lock: bool = False,
          ) -> StoreSubscription | None:
              if lock:
                  organization = await session.scalar(
                      select(Organization.id)
                      .where(Organization.id == organization_id)
                      .with_for_update()
                  )
                  if organization is None:
                      return None
              statement = select(StoreSubscription).where(
                  StoreSubscription.organization_id == organization_id,
                  StoreSubscription.provider == MOLLIE_PROVIDER,
              )
              if lock:
                  statement = statement.with_for_update()
              return await session.scalar(statement)


          ''').lstrip()
          core = replace_once(
              core,
              r"^async def _mollie_row\(.*?(?=^def _mollie_locale\()",
              new_row,
              "canonical Mollie row loader",
          )

          for name in ("_add_year", "_parse_date"):
              core = remove_function(core, name)

          core = core.replace(
              '        "subscription_id", "mandate_id", "subscription_status", "initial_payment_id",\n',
              '        "mandate_id", "initial_payment_id",\n',
              1,
          )
          core = replace_once(
              core,
              r"^    # Compatibility only: invoices created by the pre-v2 renewal flow.*?(?=^async def _ensure_receipt\()",
              "",
              "pre-v2 invoice entitlement block",
          )
          core = replace_once(
              core,
              r"        # Legacy first/subscription payments are handled below\.\n        return await _process_legacy_payment_payload\(payment\)",
              '        raise MollieBillingVerificationError("Mollie payment billing binding is missing") from exc',
              "legacy payment fallback",
          )
          for name in ("_process_legacy_payment_payload", "_process_legacy_subscription_payment"):
              core = remove_function(core, name)
          core = replace_once(
              core,
              r'^        if isinstance\(data\.get\("subscription_id"\), str\):\n            return None\n',
              "",
              "legacy renewal guard",
          )
          core = replace_once(
              core,
              r'^            if details\.get\("kind"\) in \{"initial_receipt", "renewal_receipt"\}:\n                await _ensure_receipt\(invoice_id\)\n                processed \+= 1\n            elif details\.get\("kind"\) == "renewal":\n                # Pre-v2 unbound renewal invoices could have been charge-producing\.\n                # Never re-issue them blindly after the architecture upgrade\.\n                raise MollieBillingConflict\("Legacy renewal invoice requires reconciliation"\)\n',
              '            if details.get("kind") not in {"initial_receipt", "renewal_receipt"}:\n                raise MollieBillingVerificationError("Billing invoice kind is invalid")\n            await _ensure_receipt(invoice_id)\n            processed += 1\n',
              "pre-v2 receipt reconciliation branch",
          )
          for name in ("_execute_due_renewal", "_reconcile_legacy_subscription", "sync_subscription", "run_billing_cycle"):
              core = remove_function(core, name)

          cancel_start = core.index("async def cancel_subscription(")
          cancel = core[cancel_start:]
          cancel = cancel.replace(
              "    legacy_customer: str | None = None\n    legacy_subscription: str | None = None\n",
              "",
              1,
          )
          cancel = replace_once(
              cancel,
              r'^        if isinstance\(data\.get\("mollie_customer_id"\), str\) and isinstance\(data\.get\("subscription_id"\), str\):\n            legacy_customer = data\["mollie_customer_id"\]\n            legacy_subscription = data\["subscription_id"\]\n',
              "",
              "legacy cancellation binding",
          )
          remote_cancel = cancel.find("\n    if legacy_customer and legacy_subscription:")
          if remote_cancel < 0:
              raise RuntimeError("Legacy remote cancellation block not found")
          core = core[:cancel_start] + cancel[:remote_cancel].rstrip() + "\n"
          if re.search(r"legacy|pre-v2", core, re.IGNORECASE):
              raise RuntimeError("Legacy Mollie code remains in core")
          core_path.write_text(core)

          runtime_path = Path("backend/app/services/mollie_billing_runtime.py")
          runtime = runtime_path.read_text()
          runtime = remove_function(runtime, "_reconcile_legacy_subscription_safely")
          runtime = replace_once(
              runtime,
              r'^        legacy_customer = data\.get\("mollie_customer_id"\)\n        legacy_subscription = data\.get\("subscription_id"\)\n        cancellation_pending = bool\(row\.cancelled_at and not row\.auto_renew\)\n',
              "",
              "legacy runtime state",
          )
          runtime = replace_once(
              runtime,
              r'^    if isinstance\(legacy_customer, str\) and isinstance\(legacy_subscription, str\):\n        await _reconcile_legacy_subscription_safely\(.*?^        return\n',
              "",
              "legacy runtime reconciliation",
          )
          if re.search(r"legacy|pre-v2", runtime, re.IGNORECASE):
              raise RuntimeError("Legacy Mollie code remains in runtime")
          runtime_path.write_text(runtime)

          Path("backend/app/services/mollie_billing.py").write_text(dedent('''
          """Public Mollie billing service API."""

          from app.services.mollie_billing_core import (
              MOLLIE_PROVIDER,
              OPEN_INVOICE_STATUSES,
              MollieBillingConflict,
              MollieBillingError,
              MollieBillingProfileRequired,
              MollieBillingUnavailable,
              MollieBillingVerificationError,
              MollieCheckout,
              billing_config,
              billing_configured,
              billing_readiness_errors,
              cancel_subscription,
              process_payment,
              start_checkout,
          )
          from app.services.mollie_billing_runtime import run_billing_cycle, sync_subscription

          __all__ = [
              "MOLLIE_PROVIDER",
              "OPEN_INVOICE_STATUSES",
              "MollieBillingConflict",
              "MollieBillingError",
              "MollieBillingProfileRequired",
              "MollieBillingUnavailable",
              "MollieBillingVerificationError",
              "MollieCheckout",
              "billing_config",
              "billing_configured",
              "billing_readiness_errors",
              "cancel_subscription",
              "process_payment",
              "run_billing_cycle",
              "start_checkout",
              "sync_subscription",
          ]
          ''').lstrip())

          for path in (
              "backend/app/services/mollie_billing_webhooks.py",
              "backend/tests/test_mollie_billing.py",
          ):
              item = Path(path)
              item.write_text(item.read_text().replace(
                  "from app.services.mollie_billing import (",
                  "from app.services.mollie_billing_core import (",
                  1,
              ))
          webhook_test = Path("backend/tests/test_mollie_billing_webhooks.py")
          webhook_test.write_text(webhook_test.read_text().replace(
              "from app.services.mollie_billing import _invoice_reference, _reference_invoice_id, _remote_invoice_matches_local",
              "from app.services.mollie_billing_core import _invoice_reference, _reference_invoice_id, _remote_invoice_matches_local",
              1,
          ))

          Path("backend/tests/test_mollie_sales_invoices.py").write_text(dedent('''
          from datetime import UTC, datetime
          from decimal import Decimal
          from uuid import uuid4

          import pytest

          from app.models.billing import BillingInvoice, BillingProfile
          from app.services import mollie_billing_core as core


          def _invoice(*, kind: str = "initial_receipt") -> BillingInvoice:
              now = datetime(2026, 9, 8, tzinfo=UTC)
              return BillingInvoice(
                  id=uuid4(),
                  organization_id=uuid4(),
                  provider="mollie",
                  product_id="zahlmeister.pro.yearly",
                  tariff_version="2026-09-08",
                  period_start=now,
                  period_end=now.replace(year=2027),
                  gross_amount=Decimal("29.90"),
                  currency="EUR",
                  vat_rate=Decimal("20.0"),
                  vat_scheme="standard",
                  tax_treatment="domestic_standard",
                  recipient_country="AT",
                  recipient_type="consumer",
                  idempotency_key=uuid4(),
                  status="creating",
                  created_at=now,
                  details_json=(
                      f'{{"kind":"{kind}","tax_rule_version":"2026-09-08",'
                      '"recipient":{"type":"consumer","givenName":"Test","familyName":"Customer",'
                      '"email":"customer@example.test","streetAndNumber":"Example 1",'
                      '"postalCode":"1010","city":"Vienna","country":"AT"}}'
                  ),
              )


          def _remote(item: BillingInvoice, *, status: str = "pending-payment") -> dict:
              return {
                  "resource": "sales-invoice",
                  "id": "invoice_test",
                  "mode": "test",
                  "status": status,
                  "currency": item.currency,
                  "vatScheme": item.vat_scheme,
                  "recipientIdentifier": f"zahlmeister-{item.organization_id}",
                  "recipient": {"type": item.recipient_type, "country": item.recipient_country},
                  "memo": core._invoice_reference(item),
                  "lines": [{
                      "quantity": 1,
                      "vatRate": f"{Decimal(item.vat_rate):.2f}",
                      "unitPrice": {"currency": item.currency, "value": f"{Decimal(item.gross_amount):.2f}"},
                  }],
              }


          @pytest.mark.asyncio
          @pytest.mark.parametrize("kind", ["initial_receipt", "renewal_receipt"])
          async def test_paid_period_receipts_never_create_a_second_charge(
              monkeypatch: pytest.MonkeyPatch,
              kind: str,
          ) -> None:
              captured = {}

              async def fake_request(method, path, *, json_body=None, params=None, idempotency_key=None):
                  captured.update(method=method, path=path, json_body=json_body, idempotency_key=idempotency_key)
                  return {"id": "invoice_test", "status": "paid"}

              monkeypatch.setattr(core, "_request_json", fake_request)
              item = _invoice(kind=kind)
              await core._create_remote_receipt(item, "de-AT")
              body = captured["json_body"]
              assert captured["method"] == "POST"
              assert captured["path"] == "sales-invoices"
              assert body["status"] == "paid"
              assert body["paymentDetails"] == {"source": "manual"}
              assert "customerId" not in body
              assert "mandateId" not in body
              assert body["vatMode"] == "inclusive"
              assert body["lines"][0]["unitPrice"] == {"currency": "EUR", "value": "29.90"}
              assert body["lines"][0]["vatRate"] == "20.00"
              assert core._invoice_reference(item) in body["memo"]


          def test_mollie_invoice_status_variants_are_normalized() -> None:
              assert core._normalize_sales_invoice_status("payment_reversed") == "payment-reversed"
              assert core._normalize_sales_invoice_status("payment-reversed") == "payment-reversed"
              assert core._normalize_sales_invoice_status("canceled") == "cancelled"


          @pytest.mark.asyncio
          async def test_recovery_finds_remote_invoice_before_any_new_post(monkeypatch: pytest.MonkeyPatch) -> None:
              item = _invoice(kind="renewal_receipt")
              remote = _remote(item)
              calls = []

              async def fake_request(method, path, *, json_body=None, params=None, idempotency_key=None):
                  calls.append((method, path, params))
                  return {"_embedded": {"salesInvoices": [remote]}, "_links": {"next": None}}

              monkeypatch.setattr(core, "_request_json", fake_request)
              assert await core._find_remote_invoice(item) == remote
              assert calls == [("GET", "sales-invoices", {"limit": 250})]


          def test_business_invoice_recipient_requires_tax_or_organization_identifier() -> None:
              profile = BillingProfile(
                  customer_type="business",
                  organization_name="Example GmbH",
                  billing_email="billing@example.test",
                  street_and_number="Example 1",
                  postal_code="1010",
                  city="Vienna",
                  country="AT",
                  vat_number="ATU12345678",
              )
              recipient = core._invoice_recipient(profile)
              assert recipient["type"] == "business"
              assert recipient["organizationName"] == "Example GmbH"
              assert recipient["vatNumber"] == "ATU12345678"
          ''').lstrip())
          PY

      - name: Check for stale billing references
        run: |
          set -euo pipefail
          ! grep -RniE 'legacy|pre-v2|_create_due_renewal|_apply_invoice_entitlement|_retry_local_invoice|_create_remote_invoice|_cancel_renewal_invoices|_invoice_create_retry_allowed' backend/app/services/mollie_billing*.py backend/tests/test_mollie*.py
          ! grep -Rni '_core._mollie_row =' backend

      - name: Run backend quality checks
        run: |
          docker build --target test -f docker/backend.Dockerfile -t zahlmeister-billing-cleanup-test .
          docker run --rm -e ENVIRONMENT=test -e READINESS_REQUIRE_WORKER=false zahlmeister-billing-cleanup-test sh -c 'ruff check app tests && pytest -q'

      - name: Commit tested cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/mollie_billing.py backend/app/services/mollie_billing_core.py backend/app/services/mollie_billing_runtime.py backend/app/services/mollie_billing_webhooks.py backend/tests/test_mollie_billing.py backend/tests/test_mollie_billing_webhooks.py backend/tests/test_mollie_sales_invoices.py
          git rm .github/workflows/billing-cleanup.yml
          git commit -m "Remove legacy Mollie billing paths"
          git push origin HEAD:development
