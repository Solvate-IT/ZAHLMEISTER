x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zahlmeister
      POSTGRES_USER: zahlmeister
      POSTGRES_PASSWORD_FILE: /run/secrets/internal/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zahlmeister -d zahlmeister"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./secrets/production:/run/secrets/internal:ro
    logging: *default-logging

  bootstrap:
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: zahlmeister-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.db.bootstrap"]
    volumes:
      - ./secrets/production:/run/secrets/internal:ro
      - ./secrets/ponto:/run/secrets/ponto:ro
    logging: *default-logging

  backend:
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: zahlmeister-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./secrets/production:/run/secrets/internal:ro
      - ./secrets/ponto:/run/secrets/ponto:ro
    logging: *default-logging

  worker:
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: zahlmeister-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./secrets/production:/run/secrets/internal:ro
      - ./secrets/ponto:/run/secrets/ponto:ro
    logging: *default-logging

  frontend:
    image: zahlmeister-frontend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.zahlmeister.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.zahlmeister.entrypoints=websecure
      - traefik.http.routers.zahlmeister.tls=true
      - traefik.http.services.zahlmeister.loadbalancer.server.port=80
    logging: *default-logging

volumes:
  postgres_data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
