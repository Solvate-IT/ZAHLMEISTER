x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-/run/secrets/postgres_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    group_add:
      - "${APP_RUNTIME_GID:-10001}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./secrets/production/postgres_password:/run/secrets/postgres_password:ro
    logging: *default-logging

  bootstrap:
    user: "${APP_RUNTIME_UID:-10001}:${APP_RUNTIME_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: zahlmeister-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.db.bootstrap"]
    volumes:
      - ./secrets:/run/secrets:ro
    logging: *default-logging

  backend:
    user: "${APP_RUNTIME_UID:-10001}:${APP_RUNTIME_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: zahlmeister-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./secrets:/run/secrets:ro
    logging: *default-logging

  worker:
    user: "${APP_RUNTIME_UID:-10001}:${APP_RUNTIME_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: zahlmeister-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./secrets:/run/secrets:ro
    logging: *default-logging

  frontend:
    image: zahlmeister-frontend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.zahlmeister.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.zahlmeister.entrypoints=websecure
      - traefik.http.routers.zahlmeister.tls=true
      - traefik.http.services.zahlmeister.loadbalancer.server.port=80
    logging: *default-logging

volumes:
  postgres_data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}