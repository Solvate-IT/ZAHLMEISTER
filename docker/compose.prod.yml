# Only what differs per environment or installation. Technical constants
# (provider URLs and scopes, worker and job tuning) are backend defaults in
# app/core/config.py.
x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DATABASE_URL_FILE: /run/secrets/internal/database_url
  APP_SECRET_FILE: /run/secrets/internal/app_secret
  CORS_ORIGINS: ${CORS_ORIGINS}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL}
  OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  PLATFORM_ADMIN_BOOTSTRAP_EMAIL: ${PLATFORM_ADMIN_BOOTSTRAP_EMAIL:-}
  PLATFORM_ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/internal/platform_admin_password
  PLATFORM_ADMIN_BOOTSTRAP_NAME: ${PLATFORM_ADMIN_BOOTSTRAP_NAME:-Zahlmeister Administration}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  READINESS_REQUIRE_WORKER: ${READINESS_REQUIRE_WORKER:-true}
  MONITORING_TOKEN_FILE: /run/secrets/internal/monitoring_token
  MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-smtp}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Zahlmeister}
  MAIL_REPLY_DOMAIN: ${MAIL_REPLY_DOMAIN:-}
  CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-Support@Solvate.at}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  PLATFORM_IMAP_HOST: ${PLATFORM_IMAP_HOST:-}
  PLATFORM_IMAP_PORT: ${PLATFORM_IMAP_PORT:-993}
  PLATFORM_IMAP_USERNAME: ${PLATFORM_IMAP_USERNAME:-}
  PLATFORM_IMAP_PASSWORD: ${PLATFORM_IMAP_PASSWORD:-}
  PLATFORM_IMAP_SSL: ${PLATFORM_IMAP_SSL:-true}
  PLATFORM_IMAP_STARTTLS: ${PLATFORM_IMAP_STARTTLS:-false}
  PLATFORM_IMAP_FOLDER: ${PLATFORM_IMAP_FOLDER:-INBOX}
  INFOBIP_OAUTH_CLIENT_ID: ${INFOBIP_OAUTH_CLIENT_ID:-}
  INFOBIP_OAUTH_CLIENT_SECRET: ${INFOBIP_OAUTH_CLIENT_SECRET:-}
  MICROSOFT365_CLIENT_ID: ${MICROSOFT365_CLIENT_ID:-}
  MICROSOFT365_CLIENT_SECRET: ${MICROSOFT365_CLIENT_SECRET:-}
  PONTO_CONNECT_ENVIRONMENT: ${PONTO_CONNECT_ENVIRONMENT:-live}
  PONTO_CONNECT_CLIENT_ID: ${PONTO_CONNECT_CLIENT_ID:-}
  PONTO_CONNECT_CLIENT_SECRET: ${PONTO_CONNECT_CLIENT_SECRET:-}
  PONTO_CONNECT_AUTHORIZE_URL: ${PONTO_CONNECT_AUTHORIZE_URL:-https://authorization.myponto.com/oauth2/auth}
  PONTO_CONNECT_CERT_PATH: /run/secrets/ponto/client.crt
  PONTO_CONNECT_KEY_PATH: /run/secrets/ponto/client.key
  PONTO_CONNECT_KEY_PASSWORD: ${PONTO_CONNECT_KEY_PASSWORD:-}
  MOLLIE_OAUTH_CLIENT_ID: ${MOLLIE_OAUTH_CLIENT_ID:-}
  MOLLIE_OAUTH_CLIENT_SECRET: ${MOLLIE_OAUTH_CLIENT_SECRET:-}
  MOLLIE_CONNECT_ACCESS_TOKEN: ${MOLLIE_CONNECT_ACCESS_TOKEN:-}
  MOLLIE_TEST_MODE: ${MOLLIE_TEST_MODE:-false}
  MOLLIE_BILLING_API_KEY: ${MOLLIE_BILLING_API_KEY:-}
  MOLLIE_BILLING_WEBHOOK_SECRET: ${MOLLIE_BILLING_WEBHOOK_SECRET:-}
  MOLLIE_BILLING_ENVIRONMENT: ${MOLLIE_BILLING_ENVIRONMENT:-live}
  BILLING_SELLER_LEGAL_NAME: ${BILLING_SELLER_LEGAL_NAME:-}
  BILLING_SELLER_COUNTRY: ${BILLING_SELLER_COUNTRY:-AT}
  BILLING_SELLER_EMAIL: ${BILLING_SELLER_EMAIL:-}
  BILLING_SELLER_STREET_AND_NUMBER: ${BILLING_SELLER_STREET_AND_NUMBER:-}
  BILLING_SELLER_POSTAL_CODE: ${BILLING_SELLER_POSTAL_CODE:-}
  BILLING_SELLER_CITY: ${BILLING_SELLER_CITY:-}
  BILLING_SELLER_REGION: ${BILLING_SELLER_REGION:-}
  BILLING_SELLER_VAT_NUMBER: ${BILLING_SELLER_VAT_NUMBER:-}
  BILLING_SELLER_ORGANIZATION_NUMBER: ${BILLING_SELLER_ORGANIZATION_NUMBER:-}
  BILLING_SELLER_EU_OSS_ENABLED: ${BILLING_SELLER_EU_OSS_ENABLED:-false}
  GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zahlmeister
      POSTGRES_USER: zahlmeister
      POSTGRES_PASSWORD_FILE: /run/secrets/internal/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zahlmeister -d zahlmeister"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ${INTERNAL_SECRETS_DIR:-./secrets/production}:/run/secrets/internal:ro
    logging: *default-logging

  bootstrap:
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: ${BACKEND_IMAGE:-zahlmeister-backend:latest}
    pull_policy: missing
    restart: "no"
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.db.bootstrap"]
    volumes:
      - ${INTERNAL_SECRETS_DIR:-./secrets/production}:/run/secrets/internal:ro
      - ./secrets/ponto:/run/secrets/ponto:ro
    logging: *default-logging

  backend:
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: ${BACKEND_IMAGE:-zahlmeister-backend:latest}
    pull_policy: missing
    restart: unless-stopped
    environment: *backend-environment
    networks:
      default:
        aliases:
          - zahlmeister-api-internal
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ${INTERNAL_SECRETS_DIR:-./secrets/production}:/run/secrets/internal:ro
      - ./secrets/ponto:/run/secrets/ponto:ro
    logging: *default-logging

  worker:
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    image: ${BACKEND_IMAGE:-zahlmeister-backend:latest}
    pull_policy: missing
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]
    volumes:
      - ${INTERNAL_SECRETS_DIR:-./secrets/production}:/run/secrets/internal:ro
      - ./secrets/ponto:/run/secrets/ponto:ro
    logging: *default-logging

  frontend:
    image: ${FRONTEND_IMAGE:-zahlmeister-frontend:latest}
    pull_policy: missing
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK:-solvate_proxy}
      - traefik.http.routers.zahlmeister.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.zahlmeister.entrypoints=websecure
      - traefik.http.routers.zahlmeister.tls=true
      - traefik.http.routers.zahlmeister.tls.certresolver=letsencrypt
      - traefik.http.services.zahlmeister.loadbalancer.server.port=8080
    logging: *default-logging

volumes:
  postgres18_data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-solvate_proxy}
