map $http_x_request_id $zm_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

map $http_x_real_ip $zm_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $zm_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

limit_req_zone $zm_client_ip zone=zm_api:10m rate=50r/s;
limit_req_zone $zm_client_ip zone=zm_customer_api:10m rate=20r/s;
limit_req_zone $zm_client_ip zone=zm_auth:10m rate=10r/m;
limit_req_zone $zm_client_ip zone=zm_public:10m rate=10r/s;
limit_req_zone $zm_client_ip zone=zm_checkout:10m rate=20r/m;
limit_req_zone $zm_client_ip zone=zm_contact:10m rate=5r/m;
limit_req_zone $zm_client_ip zone=zm_webhooks:10m rate=200r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), usb=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_hide_header Server;

    location ~ ^/api/v1/auth/(login|admin-login|register|forgot-password|reset-password|verify-email|resend-verification)$ {
        limit_req zone=zm_auth burst=10 nodelay;
        client_max_body_size 32k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zm_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $zm_forwarded_proto;
        proxy_set_header X-Request-ID $zm_request_id;
    }

    location = /api/v1/public/contact {
        limit_req zone=zm_contact burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zm_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $zm_forwarded_proto;
        proxy_set_header X-Request-ID $zm_request_id;
    }

    location ~ ^/api/v1/public/payments/[^/]+/online$ {
        limit_req zone=zm_checkout burst=10 nodelay;
        client_max_body_size 32k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zm_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $zm_forwarded_proto;
        proxy_set_header X-Request-ID $zm_request_id;
    }

    location ~ ^/api/v1/public/payments/ {
        limit_req zone=zm_public burst=30 nodelay;
        client_max_body_size 32k;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zm_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $zm_forwarded_proto;
        proxy_set_header X-Request-ID $zm_request_id;
    }

    location ~ ^/api/v1/webhooks/ {
        limit_req zone=zm_webhooks burst=500 nodelay;
        client_max_body_size 1m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zm_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $zm_forwarded_proto;
        proxy_set_header X-Request-ID $zm_request_id;
    }

    location /api/public/v1/ {
        limit_req zone=zm_customer_api burst=40 nodelay;
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zm_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $zm_forwarded_proto;
        proxy_set_header X-Request-ID $zm_request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        limit_req zone=zm_api burst=100 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $zm_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $zm_forwarded_proto;
        proxy_set_header X-Request-ID $zm_request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}
