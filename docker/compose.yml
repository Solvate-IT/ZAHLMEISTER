x-backend-environment: &backend-environment
  ENVIRONMENT: ${ENVIRONMENT}
  DATABASE_URL_FILE: /run/secrets/internal/database_url
  APP_SECRET_FILE: /run/secrets/internal/app_secret
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3003,capacitor://localhost,https://localhost}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3003}
  OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-http://localhost:8003}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  PLATFORM_ADMIN_BOOTSTRAP_EMAIL: ${PLATFORM_ADMIN_BOOTSTRAP_EMAIL:-}
  PLATFORM_ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/internal/platform_admin_password
  PLATFORM_ADMIN_BOOTSTRAP_NAME: ${PLATFORM_ADMIN_BOOTSTRAP_NAME:-Zahlmeister Administration}
  LOG_LEVEL: INFO
  LOG_FORMAT: ${LOG_FORMAT:-text}
  TRUST_PROXY_HEADERS: "true"
  READINESS_REQUIRE_WORKER: ${READINESS_REQUIRE_WORKER:-false}
  WORKER_HEARTBEAT_SECONDS: "15"
  WORKER_STALE_SECONDS: "60"
  MONITORING_TOKEN_FILE: /run/secrets/internal/monitoring_token
  JOB_MAX_ATTEMPTS: "7"
  JOB_RETRY_BASE_SECONDS: "5"
  JOB_RETRY_MAX_SECONDS: "900"
  JOB_RETRY_JITTER: "0.20"
  JOB_STALE_AFTER_SECONDS: "900"
  MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-smtp}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@zahlmeister.local}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Zahlmeister}
  MAIL_REPLY_DOMAIN: ${MAIL_REPLY_DOMAIN:-}
  CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-Support@Solvate.at}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  PLATFORM_IMAP_HOST: ${PLATFORM_IMAP_HOST:-}
  PLATFORM_IMAP_PORT: ${PLATFORM_IMAP_PORT:-993}
  PLATFORM_IMAP_USERNAME: ${PLATFORM_IMAP_USERNAME:-}
  PLATFORM_IMAP_PASSWORD: ${PLATFORM_IMAP_PASSWORD:-}
  PLATFORM_IMAP_SSL: ${PLATFORM_IMAP_SSL:-true}
  PLATFORM_IMAP_STARTTLS: ${PLATFORM_IMAP_STARTTLS:-false}
  PLATFORM_IMAP_FOLDER: ${PLATFORM_IMAP_FOLDER:-INBOX}
  INFOBIP_OAUTH_CLIENT_ID: ${INFOBIP_OAUTH_CLIENT_ID:-}
  INFOBIP_OAUTH_CLIENT_SECRET: ${INFOBIP_OAUTH_CLIENT_SECRET:-}
  INFOBIP_OAUTH_SCOPES: api_read message:send subscriptions:manage
  INFOBIP_OAUTH_AUTHORIZE_URL: https://oneapi.infobip.com/exchange/1/oauth/authorize
  INFOBIP_OAUTH_TOKEN_URL: https://oneapi.infobip.com/exchange/1/oauth/token
  INFOBIP_DEFAULT_BASE_URL: https://api.infobip.com
  MICROSOFT365_CLIENT_ID: ${MICROSOFT365_CLIENT_ID:-}
  MICROSOFT365_CLIENT_SECRET: ${MICROSOFT365_CLIENT_SECRET:-}
  MICROSOFT365_TENANT: organizations
  MICROSOFT365_SCOPES: openid profile offline_access User.Read Mail.Read Mail.Send
  MICROSOFT365_GRAPH_URL: https://graph.microsoft.com/v1.0
  PONTO_CONNECT_ENVIRONMENT: ${PONTO_CONNECT_ENVIRONMENT:-sandbox}
  PONTO_CONNECT_CLIENT_ID: ${PONTO_CONNECT_CLIENT_ID:-}
  PONTO_CONNECT_CLIENT_SECRET: ${PONTO_CONNECT_CLIENT_SECRET:-}
  PONTO_CONNECT_API_URL: https://api.ibanity.com/ponto-connect
  PONTO_CONNECT_AUTHORIZE_URL: ${PONTO_CONNECT_AUTHORIZE_URL:-}
  PONTO_CONNECT_TOKEN_URL: https://api.ibanity.com/ponto-connect/oauth2/token
  PONTO_CONNECT_SCOPE: offline_access ai name
  PONTO_CONNECT_CERT_PATH: /run/secrets/ponto/client.crt
  PONTO_CONNECT_KEY_PATH: /run/secrets/ponto/client.key
  PONTO_CONNECT_KEY_PASSWORD: ${PONTO_CONNECT_KEY_PASSWORD:-}
  MOLLIE_OAUTH_CLIENT_ID: ${MOLLIE_OAUTH_CLIENT_ID:-}
  MOLLIE_OAUTH_CLIENT_SECRET: ${MOLLIE_OAUTH_CLIENT_SECRET:-}
  MOLLIE_CONNECT_ACCESS_TOKEN: ${MOLLIE_CONNECT_ACCESS_TOKEN:-}
  MOLLIE_OAUTH_AUTHORIZE_URL: https://my.mollie.com/oauth2/authorize
  MOLLIE_OAUTH_TOKEN_URL: https://api.mollie.com/oauth2/tokens
  MOLLIE_API_URL: https://api.mollie.com/v2
  MOLLIE_OAUTH_SCOPES: organizations.read profiles.read payments.read payments.write
  MOLLIE_TEST_MODE: ${MOLLIE_TEST_MODE:-false}
  MOLLIE_BILLING_API_KEY: ${MOLLIE_BILLING_API_KEY:-}
  MOLLIE_BILLING_WEBHOOK_SECRET: ${MOLLIE_BILLING_WEBHOOK_SECRET:-}
  MOLLIE_BILLING_ENVIRONMENT: ${MOLLIE_BILLING_ENVIRONMENT:-test}
  MOLLIE_BILLING_RECOVERY_MAX_PAGES: "100"
  MOLLIE_BILLING_MAX_RETRIES: "3"
  MOLLIE_BILLING_GRACE_DAYS: "7"
  BILLING_SELLER_LEGAL_NAME: ${BILLING_SELLER_LEGAL_NAME:-}
  BILLING_SELLER_COUNTRY: ${BILLING_SELLER_COUNTRY:-AT}
  BILLING_SELLER_EMAIL: ${BILLING_SELLER_EMAIL:-}
  BILLING_SELLER_STREET_AND_NUMBER: ${BILLING_SELLER_STREET_AND_NUMBER:-}
  BILLING_SELLER_POSTAL_CODE: ${BILLING_SELLER_POSTAL_CODE:-}
  BILLING_SELLER_CITY: ${BILLING_SELLER_CITY:-}
  BILLING_SELLER_REGION: ${BILLING_SELLER_REGION:-}
  BILLING_SELLER_VAT_NUMBER: ${BILLING_SELLER_VAT_NUMBER:-}
  BILLING_SELLER_ORGANIZATION_NUMBER: ${BILLING_SELLER_ORGANIZATION_NUMBER:-}
  BILLING_SELLER_EU_OSS_ENABLED: ${BILLING_SELLER_EU_OSS_ENABLED:-false}
  GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
  GOOGLE_TRANSLATE_API_URL: https://translation.googleapis.com/language/translate/v2

services:
  db:
    image: postgres:18.6-alpine
    restart: "no"
    environment:
      POSTGRES_DB: zahlmeister
      POSTGRES_USER: zahlmeister
      POSTGRES_PASSWORD_FILE: /run/secrets/internal/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zahlmeister -d zahlmeister"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./secrets/development:/run/secrets/internal:ro

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: "no"
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8028}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  bootstrap:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile.dev
    restart: "no"
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.db.bootstrap"]
    volumes:
      - ../backend:/app
      - ./secrets/development:/run/secrets/internal:ro
      - ./secrets/ponto:/run/secrets/ponto:ro

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile.dev
    restart: "no"
    environment: *backend-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    ports:
      - "${BACKEND_PORT:-8003}:8000"
    volumes:
      - ../backend:/app
      - ./secrets/development:/run/secrets/internal:ro
      - ./secrets/ponto:/run/secrets/ponto:ro

  worker:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile.dev
    restart: "no"
    environment: *backend-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    command: ["python", "-m", "app.worker"]
    volumes:
      - ../backend:/app
      - ./secrets/development:/run/secrets/internal:ro
      - ./secrets/ponto:/run/secrets/ponto:ro

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile.dev
    restart: "no"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8003}/api/v1
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    command: ["sh", "-c", "if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi && npm run dev"]
    ports:
      - "${FRONTEND_PORT:-3003}:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  # Android APK/AAB toolchain. Never started by `up`; manage.sh -> 11) Android
  # App runs it with `compose --profile tools run --rm mobile`.
  mobile:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: docker/mobile.Dockerfile
      args:
        # Matched to the host user so artifacts land host-owned.
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: zahlmeister-mobile-build:local
    # Google ships the Android build tools for x86_64 only.
    platform: linux/amd64
    restart: "no"
    # tini as PID 1: forwards signals and reaps the Gradle/adb daemons.
    init: true
    environment:
      ZAHLMEISTER_SIGNING_DIR: /run/secrets/android
    volumes:
      - ../frontend:/src/frontend:ro
      - ../mobile:/src/mobile:ro
      - ../mobile/dist:/out
      - ./secrets/android:/run/secrets/android:ro
      - mobile_gradle:/home/dev/.gradle
      # Keeps the debug signing key stable, so a newer debug APK updates the
      # installed one in place.
      - mobile_android_user:/home/dev/.android

  # adb and bundletool against a USB-connected phone (Linux hosts), for
  # manage.sh -> 11) Android App -> 5) Device. adb runs as root because
  # /dev/bus/usb nodes are root-owned without Android udev rules; access is
  # limited to USB character devices (major 189). Host networking lets the
  # adb server and the WebView DevTools forward listen on the host's
  # localhost:5037 and :9222, where Chrome's chrome://inspect finds them.
  mobile-device:
    profiles: ["tools"]
    image: zahlmeister-mobile-build:local
    pull_policy: never
    platform: linux/amd64
    restart: "no"
    init: true
    user: "0:0"
    network_mode: host
    device_cgroup_rules:
      - "c 189:* rmw"
    environment:
      HOME: /home/dev
      ZAHLMEISTER_SIGNING_DIR: /run/secrets/android
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ../mobile/dist:/dist:ro
      - ../mobile/tool:/tool:ro
      - ./secrets/android:/run/secrets/android:ro
      # The adb key (the phone remembers "Always allow") and the debug
      # keystore bundletool signs debug AAB installs with.
      - mobile_android_user:/home/dev/.android

volumes:
  postgres18_data:
  frontend_node_modules:
  frontend_next:
  mobile_gradle:
  mobile_android_user:
